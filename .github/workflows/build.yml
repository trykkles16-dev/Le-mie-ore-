{"name":"Build APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-24.04","steps":[{"uses":"actions/checkout@v4"},{"name":"Estrai il progetto","run":"unzip -q \"$(ls OreLavoro-Android-v*.zip | sort -V | tail -1)\""},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Compila","working-directory":"OreLavoro","run":"gradle assembleDebug --no-daemon"},{"name":"Leggi la versione","run":"echo \"VER=$(grep versionName OreLavoro/app/build.gradle | tr -dc '0-9.')\" >> $GITHUB_ENV"},{"uses":"actions/upload-artifact@v4","with":{"name":"Le mie ore ${{ env.VER }}","path":"OreLavoro/app/build/outputs/apk/debug/*.apk"}}]}}}
